name: libre_bm6_app
description: Reads a BLE car-battery monitor.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  libre_bm6_universal_ble:
    path: ../packages/libre_bm6_universal_ble
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5
  universal_ble: ^3.3.0
  url_launcher: ^6.3.3

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
